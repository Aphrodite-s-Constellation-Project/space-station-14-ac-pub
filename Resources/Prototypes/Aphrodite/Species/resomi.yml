      points: 1
      required: false
    Tail:
      points: 2
      required: true
      defaultMarkings: [ AvaliTail, AvaliTailFeathers ]
    Legs:
      points: 2
      required: false
      defaultMarkings: [ AvaliLLegFeathers, AvaliRLegFeathers ]
    Arms:
      points: 2
      required: false
      defaultMarkings: [ AvaliLArmFeathers, AvaliRArmFeathers ]
    Head:
      points: 2
      required: false
    Chest:
      points: 1
      required: false

