- type: entity
  id: AphroditePartAvali
  parent: BaseItem
  name: "Avali body part"
  abstract: true
  components:
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice #DynamicPrice
    price: 100
  - type: Tag
    tags:
      - Trash

- type: entity
  id: AphroditeTorsoAvali
  name: "Avali torso"
  parent: AphroditePartAvali
  components:
  - type: Sprite
    netsync: false
    sprite: Aphrodite/Mobs/Species/Avali/parts.rsi
    state: "torso_m"
  - type: Icon
    sprite: Aphrodite/Mobs/Species/Avali/parts.rsi
    state: "torso_m"
  - type: BodyPart
    partType: Torso

- type: entity
