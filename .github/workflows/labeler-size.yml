name: "Labels: Size"
on: pull_request_target
jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: "pascalgn/size-label-action@v0.5.5"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          # Custom size configuration
          sizes: >
            {
              "0": ":seedling: XS (до 10 строк)",
              "10": ":herb: S (10-100 строк)",
              "100": ":deciduous_tree: M (100-1000 строк)",
              "1000": ":evergreen_tree: L (1000-5000 строк)",
              "5000": ":forest: XL (5000+ строк)"
            }
